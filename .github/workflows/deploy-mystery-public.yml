name: deploy-mystery-public

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build mystery shopper frontend
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend/mystery-shopper
        env:
          VITE_API_URL: /api
          VITE_BASE_PATH: /

  deploy:
    runs-on: [self-hosted, linux, production]
    environment: mystery-public
    needs: ci
    env:
      RELEASE_ID: mystery-public-${{ github.run_number }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
      - name: Sync workspace to triggering commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags --prune
          git checkout --force "${GITHUB_SHA}"
          git clean -ffdx
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build mystery public release bundle
        shell: bash
        run: |
          bash scripts/linux/build_mystery_public_bundle.sh "${RUNNER_TEMP}/cwscx-mystery-public-release.zip"
      - name: Push and install bundle on DMZ VM via SSH
        shell: bash
        env:
          RELEASE_ID: ${{ env.RELEASE_ID }}
          MYSTERY_PUBLIC_BASE_URL: ${{ secrets.MYSTERY_PUBLIC_BASE_URL }}
          DMZ_SSH_KEY: ${{ secrets.DMZ_SSH_KEY }}
        run: |
          set -euo pipefail

          DMZ_HOST="172.17.0.200"
          DMZ_USER="cxadmin"

          # Write SSH key to a temp file; clean it up on exit regardless
          SSH_KEY_FILE="$(mktemp)"
          trap "rm -f '${SSH_KEY_FILE}'" EXIT
          printf '%s' "${DMZ_SSH_KEY}" | base64 -d > "${SSH_KEY_FILE}"
          chmod 600 "${SSH_KEY_FILE}"

          # Validate key before use
          KEY_BYTES="$(wc -c < "${SSH_KEY_FILE}")"
          KEY_FIRST="$(head -1 "${SSH_KEY_FILE}")"
          echo "Key file: ${KEY_BYTES} bytes, first line: ${KEY_FIRST}"
          if ! ssh-keygen -y -f "${SSH_KEY_FILE}" > /dev/null 2>&1; then
            echo "::error::Private key invalid. Re-run: base64 -w 0 /tmp/dmz_deploy_key on cwscx-app01 and update DMZ_SSH_KEY secret."
            exit 1
          fi
          echo "Private key validated OK."

          SSH_OPTS="-i ${SSH_KEY_FILE} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o BatchMode=yes"
          SSH="ssh ${SSH_OPTS} ${DMZ_USER}@${DMZ_HOST}"
          SCP="scp ${SSH_OPTS}"

          # Copy bundle and install script to DMZ
          REMOTE_BUNDLE="/tmp/cwscx-mystery-public-${RELEASE_ID}.zip"
          ${SCP} "${RUNNER_TEMP}/cwscx-mystery-public-release.zip" "${DMZ_USER}@${DMZ_HOST}:${REMOTE_BUNDLE}"
          ${SCP} "scripts/linux/install_mystery_public_bundle.sh" "${DMZ_USER}@${DMZ_HOST}:/tmp/install_mystery_public_bundle.sh"

          # Install bundle; preserves existing /opt/cwscx-mystery-public/.env if present
          ${SSH} "sudo bash /tmp/install_mystery_public_bundle.sh '${REMOTE_BUNDLE}'"

          # Ensure python3-venv is present on DMZ VM (idempotent)
          ${SSH} "sudo bash -c 'apt-get install -y python3-venv 2>&1'"

          # Fix ownership after root-level install so cxadmin can create the venv
          ${SSH} "sudo bash -c 'chown -R cxadmin:www-data /opt/cwscx-mystery-public/backend'"

          # Deploy backend: creates venv, installs deps, runs alembic, (re)starts systemd service
          # Run as root so internal run_as_root() calls bypass sudo (cp to /etc/systemd, systemctl)
          ${SSH} "sudo bash /opt/cwscx-mystery-public/scripts/linux/deploy_mystery_public_backend.sh"

          # Deploy nginx with correct self-signed cert paths for cwscx-web01
          SERVER_NAME="${MYSTERY_PUBLIC_BASE_URL#https://}"
          SERVER_NAME="${SERVER_NAME#http://}"
          SERVER_NAME="${SERVER_NAME%%/*}"
          ${SSH} "sudo bash -c 'SSL_CERTIFICATE=/etc/ssl/cwscx/cwscx.crt SSL_CERTIFICATE_KEY=/etc/ssl/cwscx/cwscx.key SITE_NAME=cwscx-mystery-public SERVER_NAME=${SERVER_NAME} bash /opt/cwscx-mystery-public/scripts/linux/deploy_mystery_public_nginx.sh'"

          # Verify deployment
          ${SSH} "MYSTERY_PUBLIC_BASE_URL=${MYSTERY_PUBLIC_BASE_URL} bash /opt/cwscx-mystery-public/scripts/linux/verify_mystery_public.sh"

          # Clean up temp files on DMZ
          ${SSH} "rm -f '${REMOTE_BUNDLE}' /tmp/install_mystery_public_bundle.sh" || true
