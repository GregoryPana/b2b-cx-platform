name: analytics-release-readonly-preflight
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        required: true
        options: [staging, production]
      require_installed_source:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: analytics-readonly-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ${{ fromJSON(inputs.target == 'staging' && '["self-hosted","linux","cwscx-tst01"]' || '["self-hosted","linux","production"]') }}
    environment: ${{ inputs.target }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read-only host, runtime, source and database-head checks
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          REQUIRE_INSTALLED_SOURCE: ${{ inputs.require_installed_source }}
        run: |
          set -euo pipefail
          EXPECTED_HOST=cwscx-tst01
          if [[ "$TARGET" == production ]]; then EXPECTED_HOST=cwscx-app01; fi
          test "$(hostname -s)" = "$EXPECTED_HOST"
          systemctl is-active --quiet cwscx-backend
          systemctl show cwscx-backend -p ActiveEnterTimestamp -p ExecMainPID -p WorkingDirectory
          WORKING_DIR="$(systemctl show cwscx-backend -p WorkingDirectory --value)"
          export WORKING_DIR
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, urllib.request, urllib.error, re, ssl, shlex
          working = pathlib.Path(os.environ['WORKING_DIR']).resolve()
          root = pathlib.Path('/opt/cwscx').resolve()
          if root not in working.parents:
              raise SystemExit('Service working directory is outside the registered application root')
          report = {'target':os.environ['TARGET'], 'hostname':os.uname().nodename, 'working_directory':str(working)}
          report['disk_free_bytes'] = shutil.disk_usage(root).free
          if report['disk_free_bytes'] < 1024**3:
              raise SystemExit('Insufficient free disk for safe deployment')
          with urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10) as response:
              health = json.load(response)
          report['health'] = {k:health[k] for k in ('status','version','environment','checks') if k in health}
          checks = health.get('checks', {})
          if health.get('status') not in ('ok','ready','healthy') or checks.get('database') not in ('ok','ready','healthy'):
              raise SystemExit('Runtime or database health failed')
          files = ['app/routers/analytics.py','app/core/analytics_scope.py','app/api/mystery_shopper.py','app/api/visits_dashboard.py','app/api/admin_dashboard.py','app/api/dashboard_compat.py']
          report['source_matches_checkout'] = {}
          for name in files:
              actual, expected = working/name, pathlib.Path('backend')/name
              report['source_matches_checkout'][name] = actual.is_file() and hashlib.sha256(actual.read_bytes()).digest() == hashlib.sha256(expected.read_bytes()).digest()
          if os.environ['REQUIRE_INSTALLED_SOURCE'] == 'true' and not all(report['source_matches_checkout'].values()):
              raise SystemExit('Installed backend does not match the checked release source')
          candidates = [working/'venv/bin/python', working/'.venv/bin/python']
          interpreter = next((p for p in candidates if p.is_file()), None)
          if interpreter is None:
              raise SystemExit('Registered backend interpreter not found')
          # Load runtime config inside its own interpreter; never print values or errors
          # containing connection details. Only a read-only migration-head SELECT is run.
          code = '''
          from dotenv import load_dotenv
          import json, os
          from sqlalchemy import create_engine, text
          try:
              load_dotenv('/opt/cwscx/.env', override=True)
              url = os.environ.get('DATABASE_URL')
              if not url: raise RuntimeError('missing runtime database config')
              engine = create_engine(url, connect_args={'connect_timeout':5,'options':'-c default_transaction_read_only=on -c statement_timeout=5000'})
              with engine.connect() as connection:
                  revisions = sorted(connection.execute(text('SELECT version_num FROM alembic_version')).scalars())
              engine.dispose()
              print(json.dumps(revisions))
          except Exception:
              raise SystemExit('Read-only migration-head verification failed; connection details withheld')
          '''
          result = subprocess.run([str(interpreter), '-c', code], capture_output=True, text=True, timeout=20)
          if result.returncode:
              raise SystemExit('Read-only migration-head verification failed; details withheld')
          report['database_heads'] = json.loads(result.stdout)
          if report['database_heads'] != ['20260714_000032']:
              raise SystemExit('Live database head differs from the reviewed release head; stop before deployment')
          # An anonymous request must be rejected before any survey data is read.
          # This also distinguishes the internal route surface from mystery_public.
          try:
              with urllib.request.urlopen('http://127.0.0.1:8000/dashboard-visits/all', timeout=10):
                  raise SystemExit('Internal API unexpectedly accepted an anonymous request')
          except urllib.error.HTTPError as error:
              if error.code != 401:
                  raise SystemExit('Internal API authentication/route check did not return 401')
          report['anonymous_internal_api_status'] = 401
          host = 'cwscx-tst01.cwsey.com' if os.environ['TARGET'] == 'staging' else 'cwscx-app01.cwsey.com'
          site = 'cwscx-staging' if os.environ['TARGET'] == 'staging' else 'cwscx-production'
          nginx_config = pathlib.Path('/etc/nginx/sites-enabled')/site
          matches = re.findall(r'^\s*ssl_certificate\s+([^;]+);', nginx_config.read_text(), re.M)
          if len(matches) != 1:
              raise SystemExit('Cannot identify the registered site public certificate')
          certificate_path = pathlib.Path(matches[0].strip()).resolve()
          if not certificate_path.is_relative_to('/etc'):
              raise SystemExit('Configured certificate is outside the registered system config root')
          certificate = subprocess.run(
              ['openssl', 'x509', '-in', str(certificate_path), '-outform', 'PEM'],
              capture_output=True, text=True, timeout=10)
          if certificate.returncode and certificate_path == pathlib.Path('/etc/ssl/cwscx/cwscx.crt'):
              # Internal deploy already permits this root wrapper. Read only the
              # fixed public certificate; do not grant sudo, chmod or read a key.
              certificate = subprocess.run(
                  ['sudo', '-n', '/usr/bin/bash', '-lc', 'exec /usr/bin/openssl x509 -in /etc/ssl/cwscx/cwscx.crt -outform PEM'],
                  capture_output=True, text=True, timeout=10)
          if certificate.returncode:
              raise SystemExit('Installed public certificate cannot be verified with existing privileges; no permissions changed')
          tls = ssl.create_default_context(cadata=certificate.stdout)
          request = urllib.request.Request('https://'+host+'/dashboard/')
          with urllib.request.urlopen(request, context=tls, timeout=10) as response:
              html = response.read(1024*1024).decode('utf-8')
          assets = re.findall(r'<script[^>]+src=[\"\']([^\"\']+)[\"\']', html)
          if not assets or not assets[0].startswith('/dashboard/assets/'):
              raise SystemExit('Dashboard HTML lacks the expected release asset')
          request = urllib.request.Request('https://'+host+assets[0])
          with urllib.request.urlopen(request, context=tls, timeout=10) as response:
              served = response.read(16*1024*1024)
          asset_name = pathlib.PurePosixPath(assets[0]).name
          installed_asset = root/'frontends-src/dashboard/dist/assets'/asset_name
          if not installed_asset.is_file() or hashlib.sha256(served).digest() != hashlib.sha256(installed_asset.read_bytes()).digest():
              raise SystemExit('Served dashboard bundle differs from installed release asset')
          report['dashboard_asset_matches_installed'] = True
          print(json.dumps(report, indent=2))
          PY
