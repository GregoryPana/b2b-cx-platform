name: backend-ci

# The protected main branch requires this job's `test` status for every PR.
# Path-filtering the workflow would leave infrastructure/docs PRs pending forever.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cwscx
          POSTGRES_PASSWORD: cwscx_test
          POSTGRES_DB: cwscx_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cwscx -d cwscx_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Install Playwright Chromium (for PDF rendering)
        run: python -m playwright install --with-deps chromium
      - name: Verify Alembic graph and blank-database upgrade
        env:
          PYTHONPATH: backend
          MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://cwscx:cwscx_test@localhost:5432/cwscx_migrations
        run: pytest backend/tests/test_migrations.py
      - name: Run tests
        env:
          PYTHONPATH: backend
          TESTING: true
          DATABASE_URL: sqlite:///./ci.db
          ENTRA_TENANT_ID: ci-tenant
          ENTRA_CLIENT_ID: ci-client
          ENTRA_AUTHORITY: https://login.microsoftonline.com/ci-tenant
          ENTRA_ISSUER: https://sts.windows.net/ci-tenant/
          ENTRA_AUDIENCE: api://ci-client
        run: pytest backend/tests
