name: analytics-calculation-assurance

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    paths:
      - "backend/app/**"
      - "backend/tests/**"
      - "backend/requirements.txt"
      - "backend/requirements-analytics-test.txt"
      - "frontend/dashboard-blueprint/**"
      - "scripts/dev/verify_analytics_calculations.py"
      - ".github/workflows/analytics-calculation-assurance.yml"
  pull_request:
    paths:
      - "backend/app/**"
      - "backend/tests/**"
      - "backend/requirements.txt"
      - "backend/requirements-analytics-test.txt"
      - "frontend/dashboard-blueprint/**"
      - "scripts/dev/verify_analytics_calculations.py"
      - ".github/workflows/analytics-calculation-assurance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-calculation-assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analytics-calculation-assurance:
    name: Analytics calculation assurance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-analytics-test.txt
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/dashboard-blueprint/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-analytics-test.txt
      - name: Install Playwright Chromium (for PDF rendering tests)
        run: python -m playwright install --with-deps chromium
      - name: Install dashboard dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend/dashboard-blueprint
      - name: Analytics assurance suite (isolated PostgreSQL)
        run: >
          python scripts/dev/verify_analytics_calculations.py --scope analytics
          -- -rs --junitxml="$RUNNER_TEMP/analytics-junit.xml"
      - name: Fail if any analytics test was skipped
        run: |
          python - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "analytics-junit.xml")).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"analytics tests={tests} skipped={skipped}")
          if tests == 0 or skipped:
              sys.exit("analytics suite ran no tests or skipped some; refusing false green")
          PY
      - name: Dashboard metric tests (Node)
        run: python scripts/dev/verify_analytics_calculations.py --scope frontend
      - name: Dashboard build
        env:
          VITE_API_URL: /api
          VITE_BASE_PATH: /dashboard/
        run: npm run build
        working-directory: frontend/dashboard-blueprint
      - name: Full backend regression suite including reports and PDF (isolated PostgreSQL)
        run: >
          python scripts/dev/verify_analytics_calculations.py --scope full
          -- -rs --junitxml="$RUNNER_TEMP/backend-junit.xml"
      - name: Fail if any full-suite test was skipped
        run: |
          python - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "backend-junit.xml")).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"backend tests={tests} skipped={skipped}")
          if tests == 0 or skipped:
              sys.exit("backend suite ran no tests or skipped some; refusing false green")
          PY
