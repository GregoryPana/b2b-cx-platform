name: analytics-calculation-assurance

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    paths:
      - "backend/app/**"
      - "backend/tests/**"
      - "backend/requirements.txt"
      - "backend/requirements-analytics-test.txt"
      - "frontend/**"
      - "scripts/linux/build_release_bundle.sh"
      - "scripts/linux/build_mystery_public_bundle.sh"
      - "scripts/dev/verify_analytics_calculations.py"
      - "scripts/dev/verify_frontend_modules.py"
      - ".github/workflows/analytics-calculation-assurance.yml"
  pull_request:
    paths:
      - "backend/app/**"
      - "backend/tests/**"
      - "backend/requirements.txt"
      - "backend/requirements-analytics-test.txt"
      - "frontend/**"
      - "scripts/linux/build_release_bundle.sh"
      - "scripts/linux/build_mystery_public_bundle.sh"
      - "scripts/dev/verify_analytics_calculations.py"
      - "scripts/dev/verify_frontend_modules.py"
      - ".github/workflows/analytics-calculation-assurance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-calculation-assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analytics-calculation-assurance:
    name: Analytics calculation assurance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-analytics-test.txt
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/*/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-analytics-test.txt
      - name: Install Playwright Chromium (PDF and component fixture tests)
        run: python -m playwright install --with-deps chromium
      - name: Install locked dependencies for affected frontends
        run: |
          for app in dashboard-blueprint dashboard survey installation-survey mystery-shopper; do
            npm ci --no-audit --no-fund --prefix "frontend/$app"
          done
      - name: Frontend module-boundary tests (Node and Vitest; no skips)
        run: python scripts/dev/verify_analytics_calculations.py --scope frontend
      - name: Production frontend builds (Entra and public Mystery auth)
        run: >
          python scripts/dev/verify_frontend_modules.py --scope builds
          --build-outdir "$RUNNER_TEMP/frontend-module-builds"
      - name: Installation and Mystery component browser fixtures (not authenticated E2E)
        run: >
          python scripts/dev/verify_frontend_modules.py --scope browser
          --build-outdir "$RUNNER_TEMP/frontend-module-builds"
      # The full backend suite includes tests/analytics; do not run it twice.
      - name: Full backend regression suite including analytics, reports and PDF (isolated PostgreSQL)
        run: >
          python scripts/dev/verify_analytics_calculations.py --scope full
          -- -rs --junitxml="$RUNNER_TEMP/backend-junit.xml"
      - name: Fail if any full-suite test was skipped
        run: |
          python - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "backend-junit.xml")).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"backend tests={tests} skipped={skipped}")
          if tests == 0 or skipped:
              sys.exit("backend suite ran no tests or skipped some; refusing false green")
          PY
