name: analytics-host-repair
on:
  pull_request:
    paths:
      - 'scripts/linux/analytics_host_repair.py'
      - 'scripts/linux/analytics_release_artifact.py'
      - 'scripts/linux/tests/test_analytics_release_artifact.py'
      - '.github/workflows/export-validated-staging.yml'
      - '.github/workflows/deploy-production.yml'
      - 'scripts/linux/tests/test_analytics_host_repair.py'
      - '.github/workflows/analytics-host-repair.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/linux/analytics_host_repair.py'
      - 'scripts/linux/analytics_release_artifact.py'
      - 'scripts/linux/tests/test_analytics_release_artifact.py'
      - '.github/workflows/export-validated-staging.yml'
      - '.github/workflows/deploy-production.yml'
      - 'scripts/linux/tests/test_analytics_host_repair.py'
      - '.github/workflows/analytics-host-repair.yml'
permissions:
  contents: read
concurrency:
  group: analytics-repair-tests-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disposable repair, rollback and real HTTPS regressions
        run: >
          docker run --rm --network none --cap-drop ALL
          --security-opt no-new-privileges --read-only
          --tmpfs /scratch:rw,nosuid,noexec,size=64m -e TMPDIR=/scratch
          -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo python:3.12-slim
          python -m unittest discover -s scripts/linux/tests -p "test_analytics_*.py" -v
